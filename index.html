<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Order Delivery</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><h1>QR Order Delivery</h1><nav><button onclick="tab('sales')">New Order</button><button onclick="tab('delivery')">Scan / Deliver</button></nav><section id="sales"><h2>Create Order</h2><label>Customer Name<input id="customerName"></label><label>Mobile<input id="customerMobile" inputmode="tel"></label><div id="items"></div><button class="light" onclick="addItem()">+ Add Item</button><p class="total">Total: ₹<span id="total">0.00</span></p><button onclick="createOrder()">Create Order & QR</button><div id="created" class="card hide"><h3>Order Created</h3><div id="qr"></div><p><b>Order:</b> <span id="createdNo"></span></p><p><b>Amount:</b> ₹<span id="createdAmount"></span></p><button class="light" onclick="shareQr()">Share / Download QR</button></div></section><section id="delivery" class="hide"><h2>Delivery Counter</h2><div id="reader"></div><div class="buttons"><button onclick="startScanner()">Start Camera</button><button class="light" onclick="stopScanner()">Stop</button></div><p class="center">or upload QR image</p><input type="file" id="qrFile" accept="image/*" onchange="scanFile(this)"><label>Manual token (test)<input id="manualToken"></label><button class="light" onclick="lookup(manualToken.value.trim())">Lookup</button><div id="orderCard" class="card hide"></div></section><div id="msg"></div></main><script src="assets/libs/qrcode.min.js"></script><script src="assets/libs/html5-qrcode.min.js"></script><script src="assets/app.js"></script></body></html>
